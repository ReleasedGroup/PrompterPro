name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Install offline speech model
        run: npm run speech:model

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Exercise offline speech engine
        run: npm run speech:smoke

      - name: Build web and desktop server assets
        run: npm run build:desktop
