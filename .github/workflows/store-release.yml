name: Microsoft Store release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, for example 1.2.0
        required: true
        type: string
      publish:
        description: Publish to Microsoft Store
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.productName }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: prompterpro
            productName: PrompterPro
            identityName: ReleasedPtyLtd.PrompterPro
            productId: ""
          - variant: simpleprompt
            productName: SimplePrompt
            identityName: ReleasedPtyLtd.SimplePrompt
            productId: 9MT1X5BNTHQS
    env:
      PROMPTER_VARIANT: ${{ matrix.variant }}
      VITE_APP_VARIANT: ${{ matrix.variant }}
      MS_STORE_PRODUCT_ID: ${{ matrix.productId || vars.MS_STORE_PRODUCT_ID }}
      MS_STORE_IDENTITY_NAME: ${{ matrix.identityName }}
      MS_STORE_PUBLISHER: CN=E3BDC624-0B0A-4256-85B0-5AE714EA8897
      MS_STORE_PUBLISHER_DISPLAY_NAME: Released Pty Ltd

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm

      - name: Select release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use MAJOR.MINOR.PATCH."
          }
          npm version $version --no-git-tag-version
          "MS_STORE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Install offline speech model
        run: npm run speech:model

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Exercise offline speech engine
        run: npm run speech:smoke

      - name: Build unsigned multi-architecture MSIX bundle
        run: npm run package:windows

      - name: Exercise ARM64 service sidecar
        run: npm run speech:smoke:arm64

      - name: Upload MSIX bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.productName }}-${{ env.MS_STORE_VERSION }}-x64-arm64
          path: out/store/${{ matrix.productName }}_*.msixbundle
          if-no-files-found: error
          compression-level: 0

      - name: Install Microsoft Store CLI
        if: >-
          (github.event_name == 'push' || inputs.publish) &&
          env.MS_STORE_PRODUCT_ID != '' &&
          env.MS_STORE_IDENTITY_NAME != '' &&
          env.MS_STORE_PUBLISHER != '' &&
          env.MS_STORE_PUBLISHER_DISPLAY_NAME != ''
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish Store update
        if: >-
          (github.event_name == 'push' || inputs.publish) &&
          env.MS_STORE_PRODUCT_ID != '' &&
          env.MS_STORE_IDENTITY_NAME != '' &&
          env.MS_STORE_PUBLISHER != '' &&
          env.MS_STORE_PUBLISHER_DISPLAY_NAME != ''
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $missingSecrets = @()
          foreach ($name in @(
            "AZURE_AD_APPLICATION_CLIENT_ID",
            "AZURE_AD_APPLICATION_SECRET",
            "AZURE_AD_TENANT_ID",
            "SELLER_ID"
          )) {
            if ([string]::IsNullOrWhiteSpace(
              [Environment]::GetEnvironmentVariable($name)
            )) {
              $missingSecrets += $name
            }
          }
          if ($missingSecrets.Count -gt 0) {
            throw "Missing Store secrets: $($missingSecrets -join ', ')"
          }
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          $package = Get-ChildItem "out/store/${{ matrix.productName }}_*.msixbundle" |
            Select-Object -First 1
          msstore publish $package.FullName -id $env:MS_STORE_PRODUCT_ID
