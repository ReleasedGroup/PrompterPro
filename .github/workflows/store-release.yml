name: Microsoft Store release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, for example 1.2.0
        required: true
        type: string
      publish:
        description: Publish to Microsoft Store
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
      MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
      MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
      MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm

      - name: Select release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use MAJOR.MINOR.PATCH."
          }
          npm version $version --no-git-tag-version
          "MS_STORE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Install offline speech model
        run: npm run speech:model

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Exercise offline speech engine
        run: npm run speech:smoke

      - name: Build unsigned MSIX
        run: npm run package:windows

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prompter-${{ env.MS_STORE_VERSION }}-x64
          path: out/store/*.msix
          if-no-files-found: error

      - name: Install Microsoft Store CLI
        if: >-
          (github.event_name == 'push' || inputs.publish) &&
          env.MS_STORE_PRODUCT_ID != '' &&
          env.MS_STORE_IDENTITY_NAME != '' &&
          env.MS_STORE_PUBLISHER != '' &&
          env.MS_STORE_PUBLISHER_DISPLAY_NAME != ''
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish Store update
        if: >-
          (github.event_name == 'push' || inputs.publish) &&
          env.MS_STORE_PRODUCT_ID != '' &&
          env.MS_STORE_IDENTITY_NAME != '' &&
          env.MS_STORE_PUBLISHER != '' &&
          env.MS_STORE_PUBLISHER_DISPLAY_NAME != ''
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $missingSecrets = @()
          foreach ($name in @(
            "AZURE_AD_APPLICATION_CLIENT_ID",
            "AZURE_AD_APPLICATION_SECRET",
            "AZURE_AD_TENANT_ID",
            "SELLER_ID"
          )) {
            if ([string]::IsNullOrWhiteSpace(
              [Environment]::GetEnvironmentVariable($name)
            )) {
              $missingSecrets += $name
            }
          }
          if ($missingSecrets.Count -gt 0) {
            throw "Missing Store secrets: $($missingSecrets -join ', ')"
          }
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          $package = Get-ChildItem "out/store/*.msix" | Select-Object -First 1
          msstore publish $package.FullName -id $env:MS_STORE_PRODUCT_ID
